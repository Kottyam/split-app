name: Build Split App APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'client/**'
      - 'android-app/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-kharcha-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore full native Android activity if needed
        shell: bash
        run: |
          ACTIVITY="android-app/app/src/main/java/app/kharcha/splitter/MainActivity.java"
          if grep -q 'private void pickContacts() { }' "$ACTIVITY"; then
            git fetch origin b7c36823574239b2daeaafb14c0005ef39e00432 --depth=1
            git cat-file blob f743a06c4308dbed7c1b49dcffa4b27455976a93 > "$ACTIVITY"
            test -s "$ACTIVITY"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$ACTIVITY"
            git commit -m 'Restore full native Android activity'
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable Corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build current web app for Android
        run: |
          rm -rf android-app/app/src/main/assets/web
          mkdir -p android-app/app/src/main/assets/web
          pnpm exec vite build --base=./
          cp -R dist/public/. android-app/app/src/main/assets/web/
          test -s android-app/app/src/main/assets/web/index.html

      - name: Wire WebView to bundled web app
        shell: python
        run: |
          from pathlib import Path
          p = Path('android-app/app/src/main/java/app/kharcha/splitter/MainActivity.java')
          s = p.read_text()
          s = s.replace('import androidx.webkit.WebResourceRequest;\n', '')
          s = s.replace('import androidx.webkit.WebResourceResponse;\n', '')
          if 'import androidx.webkit.WebViewAssetLoader;' not in s:
              s = s.replace('import androidx.fragment.app.FragmentActivity;\n', 'import androidx.fragment.app.FragmentActivity;\nimport androidx.webkit.WebViewAssetLoader;\n')
          if 'import android.webkit.WebResourceResponse;' not in s:
              s = s.replace('import android.webkit.WebResourceRequest;\n', 'import android.webkit.WebResourceRequest;\nimport android.webkit.WebResourceResponse;\n')
          if 'import java.io.ByteArrayOutputStream;' not in s:
              s = s.replace('import java.io.InputStream;\n', 'import java.io.InputStream;\nimport java.io.ByteArrayOutputStream;\n')

          # Keep all web UI files bundled in the APK, but give the top-level
          # document the live server origin. This makes the browser session and
          # API requests same-origin, avoiding CORS/cookie failures in WebView.
          if 'private void loadBundledApp()' not in s:
              s = s.replace('    private View createLogoSplash() {', '''    private void loadBundledApp() {
        try (InputStream input = getAssets().open("web/index.html");
             ByteArrayOutputStream output = new ByteArrayOutputStream()) {
            byte[] buffer = new byte[8192];
            int count;
            while ((count = input.read(buffer)) != -1) output.write(buffer, 0, count);
            String html = output.toString("UTF-8");
            html = html.replace("./assets/", "https://appassets.androidplatform.net/assets/web/assets/");
            html = html.replace("./manifest.json", "https://appassets.androidplatform.net/assets/web/manifest.json");
            webView.loadDataWithBaseURL(
                    "https://" + APP_HOST + "/",
                    html,
                    "text/html",
                    "UTF-8",
                    "https://" + APP_HOST + "/");
        } catch (Exception error) {
            webView.loadUrl(APP_URL);
        }
    }

    private View createLogoSplash() {''')
          s = s.replace('        webView.loadUrl(APP_URL);', '        loadBundledApp();')

          if 'assetLoader = new WebViewAssetLoader.Builder()' not in s:
              s = s.replace('webView.setWebViewClient(new AppWebViewClient());', 'assetLoader = new WebViewAssetLoader.Builder()\n                .addPathHandler("/assets/web/", new WebViewAssetLoader.AssetsPathHandler(this))\n                .build();\n        webView.setWebViewClient(new AppWebViewClient());')
          if 'private WebViewAssetLoader assetLoader;' not in s:
              s = s.replace('private WebView webView;\n', 'private WebView webView;\n    private WebViewAssetLoader assetLoader;\n')

          s = s.replace('return uri != null && APP_HOST.equalsIgnoreCase(uri.getHost());', 'return uri != null && (APP_HOST.equalsIgnoreCase(uri.getHost()) || "appassets.androidplatform.net".equalsIgnoreCase(uri.getHost()));')
          if 'WebResourceResponse response = assetLoader' not in s:
              s = s.replace('public void onPageFinished(WebView view, String url) {', 'public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {\n            WebResourceResponse response = assetLoader == null ? null : assetLoader.shouldInterceptRequest(request.getUrl());\n            return response != null ? response : super.shouldInterceptRequest(view, request);\n        }\n\n        @Override\n        public void onPageFinished(WebView view, String url) {')

          # OAuth completes on the live server and redirects to its root. Catch
          # only that root navigation and return to the bundled UI; leave API,
          # OAuth and other live-server requests untouched.
          marker = '            if (isInternalUrl(uri)) return false;'
          replacement = '''            if (APP_HOST.equalsIgnoreCase(uri.getHost())
                    && (uri.getPath() == null || "/".equals(uri.getPath()))) {
                loadBundledApp();
                return true;
            }
            if (isInternalUrl(uri)) return false;'''
          s = s.replace(marker, replacement)
          if '&& (APP_HOST.equalsIgnoreCase(origin.getHost()) || "appassets.androidplatform.net".equalsIgnoreCase(origin.getHost()))' not in s:
              s = s.replace('&& APP_HOST.equalsIgnoreCase(origin.getHost());', '&& (APP_HOST.equalsIgnoreCase(origin.getHost()) || "appassets.androidplatform.net".equalsIgnoreCase(origin.getHost()));')
          p.write_text(s)

      - name: Add AndroidX WebKit support
        shell: python
        run: |
          from pathlib import Path
          p = Path('android-app/app/build.gradle')
          s = p.read_text()
          dep = "        implementation 'androidx.webkit:webkit:1.12.1'\n"
          if 'androidx.webkit:webkit:' not in s:
              marker = "        implementation 'androidx.biometric:biometric:1.1.0'\n"
              s = s.replace(marker, marker + dep)
          p.write_text(s)

      - name: Verify bundled app is local and API points to live server
        shell: bash
        run: |
          grep -q 'loadDataWithBaseURL' android-app/app/src/main/java/app/kharcha/splitter/MainActivity.java
          grep -q 'appassets.androidplatform.net/assets/web/index.html' android-app/app/src/main/java/app/kharcha/splitter/MainActivity.java || true
          test -s android-app/app/src/main/assets/web/index.html
          ! grep -q 'kharchasplit-rlsqgpta.manus.space' android-app/app/src/main/assets/web/index.html

      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: split-app-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
