name: Build Split App APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'client/**'
      - 'android-app/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-kharcha-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore full native Android activity if needed
        shell: bash
        run: |
          ACTIVITY="android-app/app/src/main/java/app/kharcha/splitter/MainActivity.java"
          if grep -q 'private void pickContacts() { }' "$ACTIVITY"; then
            git show b7c36823574239b2daeaafb14c0005ef39e00432:$ACTIVITY > "$ACTIVITY"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$ACTIVITY"
            git commit -m 'Restore full native Android activity'
            git push
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enable Corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build exact web app from this checkout
        run: pnpm exec vite build
      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: split-app-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
