name: Build Split App APK

# APK embeds the exact web build from this commit.
on:
  workflow_dispatch:
  push:
    paths:
      - 'client/**'
      - 'android-app/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-kharcha-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable Corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm --version

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build web app for embedded APK
        run: pnpm exec vite build --base ./

      - name: Embed current web build into APK
        run: |
          rm -rf android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/assets
          cp -R dist/public/. android-app/app/src/main/assets/
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android-app/app/src/main/java/app/kharcha/splitter/MainActivity.java')
          text = path.read_text()
          text = text.replace(
              'private static final String APP_URL = "https://" + APP_HOST + "/?android=1";',
              'private static final String APP_URL = "file:///android_asset/index.html?android=1";'
          )
          text = text.replace(
              'return uri != null && APP_HOST.equalsIgnoreCase(uri.getHost());',
              'return uri != null && ("file".equalsIgnoreCase(uri.getScheme()) || APP_HOST.equalsIgnoreCase(uri.getHost()));'
          )
          path.write_text(text)
          PY

      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: split-app-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
