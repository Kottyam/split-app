name: Build Split App APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'vite.config.ts'
      - 'twa-manifest.json'
      - 'android-app/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-kharcha-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable Corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Local-first runtime audit
        run: pnpm verify:local

      - name: Typecheck
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build production web/server
        run: pnpm build

      - name: Build current web app for Android
        run: |
          rm -rf android-app/app/src/main/assets/web
          mkdir -p android-app/app/src/main/assets/web
          pnpm exec vite build --base=./
          cp -R dist/public/. android-app/app/src/main/assets/web/
          test -s android-app/app/src/main/assets/web/index.html

      - name: Verify local-first bundle
        run: |
          python3 scripts/verify_android_bundle.py
          python3 scripts/verify_android_package.py

      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Verify APK output
        working-directory: android-app
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: split-app-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
