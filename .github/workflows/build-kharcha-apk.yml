name: Build Split App APK

# Build an APK that keeps the app inside the Android WebView.
# The web UI is built on every APK build, while the Android shell uses the
# deployed HTTPS origin so API/auth/cookie flows keep the same origin they
# were designed for.
on:
  workflow_dispatch:
  push:
    paths:
      - 'client/**'
      - 'android-app/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-kharcha-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable Corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm --version

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build web app
        run: pnpm exec vite build

      - name: Verify Android source is not rewritten for file:// loading
        run: |
          if grep -q 'file:///android_asset/index.html' android-app/app/src/main/java/app/kharcha/splitter/MainActivity.java; then
            echo 'ERROR: MainActivity is configured for file:// loading, which breaks the React module/API origin.'
            exit 1
          fi
          grep -q 'https://" + APP_HOST + "/?android=1' android-app/app/src/main/java/app/kharcha/splitter/MainActivity.java

      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: split-app-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
