name: Build Split App APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'client/**'
      - 'android-app/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-kharcha-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore full native Android activity if needed
        shell: bash
        run: |
          ACTIVITY="android-app/app/src/main/java/app/kharcha/splitter/MainActivity.java"
          if grep -q 'private void pickContacts() { }' "$ACTIVITY"; then
            git fetch origin b7c36823574239b2daeaafb14c0005ef39e00432 --depth=1
            git cat-file blob f743a06c4308dbed7c1b49dcffa4b27455976a93 > "$ACTIVITY"
            test -s "$ACTIVITY"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$ACTIVITY"
            git commit -m 'Restore full native Android activity'
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable Corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build current web app for Android
        run: |
          rm -rf android-app/app/src/main/assets/web
          mkdir -p android-app/app/src/main/assets/web
          pnpm exec vite build --base=./
          cp -R dist/public/. android-app/app/src/main/assets/web/
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android-app/app/src/main/assets/web/index.html')
          html = path.read_text()
          html = re.sub(r'\s*<script\s+defer\s+src="%VITE_ANALYTICS_ENDPOINT%/umami"[^>]*data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"[^>]*></script>', '', html)
          path.write_text(html)
          PY
          test -s android-app/app/src/main/assets/web/index.html

      - name: Wire WebView to bundled web app
        run: python3 scripts/android_webview_patch.py

      - name: Add AndroidX WebKit support
        run: python3 scripts/android_gradle_patch.py

      - name: Verify bundled app
        run: |
          grep -q 'loadDataWithBaseURL' android-app/app/src/main/java/app/kharcha/splitter/MainActivity.java
          grep -q 'fallbackToHostedApp' android-app/app/src/main/java/app/kharcha/splitter/MainActivity.java
          test -s android-app/app/src/main/assets/web/index.html
          ! grep -q 'kharchasplit-rlsqgpta.manus.space' android-app/app/src/main/assets/web/index.html
          ! grep -q '%VITE_ANALYTICS_' android-app/app/src/main/assets/web/index.html
          grep -q '<div id="root"></div>' android-app/app/src/main/assets/web/index.html
          grep -q '<script type="module" crossorigin src="./assets/' android-app/app/src/main/assets/web/index.html
          ! grep -q '<script[[:space:]]*$' android-app/app/src/main/assets/web/index.html

      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: split-app-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
