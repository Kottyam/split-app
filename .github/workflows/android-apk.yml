name: Build Kharcha APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Android package
        run: pnpm android:verify

      - name: Prepare web bundle
        run: |
          pnpm build
          rm -rf android-app/app/src/main/assets/web
          mkdir -p android-app/app/src/main/assets/web
          cp -R dist/public/. android-app/app/src/main/assets/web/
          test -f android-app/app/src/main/assets/web/index.html
          test -f android-app/app/src/main/assets/web/manifest.json

      - name: Build signed release APK
        working-directory: android-app
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/android-app/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "${RELEASE_STORE_PASSWORD}" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "${RELEASE_KEY_ALIAS}" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "${RELEASE_KEY_PASSWORD}" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          test -s release.keystore
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify APK exists
        run: |
          test -f android-app/app/build/outputs/apk/release/app-release.apk
          ls -lh android-app/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kharcha-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
